name: Publish release JAR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (create a draft Release first)
        required: true
        default: Crity0.7.0-PRE1-v3

permissions:
  contents: write

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Verify existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$RELEASE_TAG" --json tagName --jq .tagName
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          cache-read-only: true
      - name: Check and build tagged source
        run: ./gradlew --no-daemon clean check jar
      - name: Upload JAR and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .Version src/main/resources/manifest.json)
          gh release upload "$RELEASE_TAG" "build/libs/Crity-${version}.jar" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
