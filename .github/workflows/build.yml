name: Build Crity

on:
  push:
    branches: [main]
    tags: ['Crity*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Check and build
        run: ./gradlew --no-daemon clean check jar
      - name: Read mod version
        id: mod
        run: echo "version=$(jq -r .Version src/main/resources/manifest.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Crity-${{ steps.mod.outputs.version }}
          path: build/libs/Crity-${{ steps.mod.outputs.version }}.jar
          if-no-files-found: error
          retention-days: 90
